name: Deploy Site

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'public/**'

# Serialize dengan workflow lain yang commit/deploy ke gh-pages.
concurrency:
  group: dataweb-repo-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # prebuild: acak ulang spintax testimoni -> data/testimonials.yaml
      # build   : hugo --minify + sitemap.xml.gz + robots.txt
      - name: Build Site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: betonjago.co.id
          full_commit_message: ${{ github.event.head_commit.message || format('Deploy — {0}', github.run_id) }}
