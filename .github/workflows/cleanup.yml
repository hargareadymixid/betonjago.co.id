name: Clean up workflow runs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs (keep newest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "/repos/${{ github.repository }}/actions/runs?per_page=100" -q '.workflow_runs | sort_by(.created_at) | reverse | .[5:] | .[].id' | while read id; do
            echo "Deleting run: $id"
            gh api --method DELETE "/repos/${{ github.repository }}/actions/runs/$id" >/dev/null 2>&1 || true
          done
