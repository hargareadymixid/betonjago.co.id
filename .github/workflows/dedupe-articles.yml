name: Dedupe Similar Articles (manual)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = hapus artikel + tulis redirect. false = DRY-RUN (hanya laporan)'
        type: boolean
        default: false
      section:
        description: 'Folder di content/ yang diperiksa (hanya artikel hasil generate: blog)'
        type: string
        default: 'blog'
      max_delete:
        description: 'Batas pengaman: batal jika artikel yang akan dihapus lebih dari ini'
        type: string
        default: '40'

concurrency:
  group: dataweb-repo-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run dedupe (dry-run atau apply)
        env:
          IN_APPLY: ${{ inputs.apply }}
          IN_SECTION: ${{ inputs.section }}
          IN_MAX: ${{ inputs.max_delete }}
        run: |
          ARGS="--section=$IN_SECTION --max-delete=$IN_MAX"
          if [ "$IN_APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          node tools/dedupe-articles.js $ARGS
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedupe-report
          path: dedupe-report.json
          if-no-files-found: ignore
      - name: Commit and Push
        id: commit_push
        if: ${{ inputs.apply }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A content/
          for p in static/redirects.js .excluded-keywords.json dedupe-report.json; do [ -e "$p" ] && git add "$p" || true; done
          if git diff --staged --quiet; then echo "published=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Dedupe: gabungkan artikel mirip + tambah redirect"
          for i in 1 2 3 4 5; do
            if git push origin master; then echo "published=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            [ "$i" -eq 5 ] && exit 1
            sleep $(( (RANDOM % 10) + 5 )); git fetch origin master
            git stash push -u -m x || true; git rebase origin/master; git stash drop || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger Deploy
        if: steps.commit_push.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
